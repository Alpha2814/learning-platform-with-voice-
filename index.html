<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice & Type Search</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script> <!-- For API calls -->
</head>
<body>
    <header>
        <h1>Powerful Search with Voice & Typing</h1>
        <p>Search the web using typing or voice commands</p>
    </header>

    <div id="search-container">
        <input type="text" id="search-bar" placeholder="Type your search query here..." />
        <button id="voice-search-btn">🎙️ Voice Search</button>
    </div>

    <div id="search-results"></div>

    <script>
        // Function to handle search via typing
        document.getElementById("search-bar").addEventListener("input", function() {
            let query = this.value.trim();
            if (query) {
                fetchSearchResults(query);
            } else {
                document.getElementById("search-results").innerHTML = '';
            }
        });

        // Function to fetch search results using a custom API (like Google Custom Search)
        function fetchSearchResults(query) {
            const apiKey = 'YOUR_GOOGLE_API_KEY'; // Replace with your API Key
            const cx = 'YOUR_GOOGLE_CX'; // Replace with your Custom Search Engine ID

            axios.get(`https://www.googleapis.com/customsearch/v1?q=${query}&key=${apiKey}&cx=${cx}`)
                .then(response => {
                    displaySearchResults(response.data.items);
                })
                .catch(error => {
                    console.error("Error fetching search results: ", error);
                    document.getElementById("search-results").innerHTML = "<p>Error fetching results.</p>";
                });
        }

        // Function to display search results
        function displaySearchResults(results) {
            let output = '';
            if (results && results.length > 0) {
                results.forEach(result => {
                    output += `
                        <div class="search-result">
                            <h3><a href="${result.link}" target="_blank">${result.title}</a></h3>
                            <p>${result.snippet}</p>
                        </div>
                    `;
                });
            } else {
                output = "<p>No results found.</p>";
            }
            document.getElementById("search-results").innerHTML = output;
        }

        // Function to start voice search
        document.getElementById("voice-search-btn").addEventListener("click", function() {
            if (!('webkitSpeechRecognition' in window)) {
                alert("Your browser does not support speech recognition.");
                return;
            }

            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById("search-bar").value = transcript;
                fetchSearchResults(transcript);
            };

            recognition.onerror = function(event) {
                console.error('Speech recognition error: ', event.error);
                alert("Sorry, there was an error with voice recognition.");
            };
        });

    </script>
</body>
</html>
